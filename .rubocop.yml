# Single linter for the whole repo: the solutions and the runner share these
# rules. RuboCop's defaults are kept except for the thresholds adjusted below.
plugins:
  - rubocop-performance

AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "coverage/**/*"

# Length and complexity limits raised from RuboCop's defaults; tests are exempt.
Metrics:
  Exclude:
    - "runner/test/**/*"

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 25

Metrics/ClassLength:
  Max: 250

Metrics/ModuleLength:
  Max: 200

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

# Keyword arguments are self-documenting; don't count them.
Metrics/ParameterLists:
  CountKeywordArgs: false

# Namespace modules and test classes need no doc comment.
Style/Documentation:
  Enabled: false

# Allow `$!` without requiring "English".
Style/SpecialGlobalVars:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames:
    - ui
    - io
    - id
    - ok
    - x
    - y
