name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: rake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true

      - name: rake check
        run: bundle exec rake check
        env:
          NO_COLOR: '1'
          AOC_ASCII: '1'
